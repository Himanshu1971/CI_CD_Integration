workflows:
  qa-maestro-tests:
    name: QA Branch - Build & Maestro Tests
    max_build_duration: 30
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'qa'
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk
